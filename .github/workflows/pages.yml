name: Uppdatera data och publicera hemsidan

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 17 * * 1-5" # vardagar efter stängning i Stockholm (UTC)
    - cron: "43 22 * * 1-5" # vardagar efter stängning i USA (UTC)
    - cron: "7 6 * * *" # varje morgon, även helger: nya fotbollsresultat
    - cron: "11 16 * * 2,5" # tisdag och fredag eftermiddag: nya fotbollsodds
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install yfinance numpy pandas
      - run: python scripts/fetch_data.py
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: node scripts/scan.js
      - name: Fotbollsdata (site/fotboll)
        run: python scripts/fotboll/build.py
        continue-on-error: true # aktiesidan publiceras även om fotbollskällan inte svarar
      - name: Signalbot för Nasdaq 100 och guld (site/trading)
        run: python scripts/trading/build.py
        continue-on-error: true # resten av sidan publiceras även om Yahoo inte svarar
      - name: Signalbot live-adress (sidan läser färska signaler från grenen trading-data)
        run: |
          mkdir -p site/trading/data
          echo '{"url":"https://raw.githubusercontent.com/${{ github.repository }}/trading-data/signals.json"}' > site/trading/data/live.json
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
