name: Uppdatera data och publicera hemsidan

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 17 * * 1-5" # vardagar efter stängning i Stockholm (UTC)
    - cron: "43 22 * * 1-5" # vardagar efter stängning i USA (UTC)
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install yfinance
      - run: python scripts/fetch_data.py
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: node scripts/scan.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
