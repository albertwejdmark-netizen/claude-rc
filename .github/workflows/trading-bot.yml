name: Signalbot (Nasdaq 100 och guld)

# Kör boten var 5:e minut när marknaderna är öppna:
#  1. räknar signaler på alla sju tidsramar,
#  2. skickar nya signaler till Telegram och/eller Discord,
#  3. lägger färska signaler på grenen "trading-data", som hemsidan läser varje minut (live).
# GitHub startar schemalagda jobb med några minuters fördröjning. För 1- och 5-minuterssignaler
# i realtid: kör `python scripts/trading/build.py --notify --loop 60` på en egen dator eller server.
#
# Lägg in i Settings → Secrets and variables → Actions:
#   TELEGRAM_BOT_TOKEN och TELEGRAM_CHAT_ID  (Telegram)
#   DISCORD_WEBHOOK_URL                      (Discord)
# Valfritt under Variables: SITE_URL (länk till sidan i meddelandena)

on:
  schedule:
    - cron: "*/5 * * * 1-5"    # var 5:e minut måndag–fredag (UTC)
    - cron: "*/5 22,23 * * 0"  # söndag kväll när terminerna öppnar
  workflow_dispatch:

permissions:
  contents: write # för att uppdatera grenen trading-data

concurrency:
  group: trading-bot
  cancel-in-progress: false

jobs:
  signals:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: .github/workflows/trading-bot.yml
      - run: pip install yfinance numpy pandas
      # minnet av skickade signaler och sparade testresultat (räknas om en gång i timmen)
      - uses: actions/cache/restore@v4
        with:
          path: |
            .cache/trading_sent.json
            .cache/trading_fit.pkl
          key: trading-${{ github.run_id }}
          restore-keys: trading-
      - name: Räkna signaler och skicka nya
        run: python scripts/trading/build.py --notify
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          SITE_URL: ${{ vars.SITE_URL }}
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: |
            .cache/trading_sent.json
            .cache/trading_fit.pkl
          key: trading-${{ github.run_id }}
      - name: Publicera färska signaler till grenen trading-data
        run: |
          mkdir -p /tmp/live && cp site/trading/data/signals.json /tmp/live/
          cd /tmp/live
          git init -q -b trading-data
          git -c user.name="signalbot" -c user.email="signalbot@users.noreply.github.com" add signals.json
          git -c user.name="signalbot" -c user.email="signalbot@users.noreply.github.com" commit -qm "Signaler $(date -u +%Y-%m-%dT%H:%MZ)"
          # en enda commit som skrivs över varje gång, så att historiken inte växer
          git push -qf "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" trading-data
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
